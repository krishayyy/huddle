name: Huddle
options:
  bundleIdPrefix: com.example      # <- change to your own, e.g. com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""           # <- set your Apple team ID
    BUNDLE_ID_PREFIX: com.example  # <- keep in sync with bundleIdPrefix above
targets:
  Huddle:
    type: application
    platform: iOS
    sources: [Sources/HuddleApp.swift, Sources/Models, Sources/Networking, Sources/Views, Sources/Games, Sources/Shared, Sources/PrivacyInfo.xcprivacy]
    dependencies:
      - target: HuddleMonitor
      - target: HuddleShield
      - target: HuddleWidgets
    entitlements:
      path: Huddle.entitlements
      properties:
        # Full lock needs this. Development builds work on your own devices; shipping to the
        # App Store needs Apple's approval. Delete this block to build without full lock.
        com.apple.developer.family-controls: true
        # Huddle coaster (NFC sticker) joining. Needs a paid Apple developer account.
        # Delete this line to build without it; the "Tap a coaster" button then hides itself.
        com.apple.developer.nfc.readersession.formats: [TAG]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Huddle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NFCReaderUsageDescription: Tap a Huddle coaster to join your friends' huddle.
        NSLocalNetworkUsageDescription: Huddle connects to friends' phones nearby so you can lock in and play together.
        NSBonjourServices:
          - _huddle-app._tcp
          - _huddle-app._udp
  HuddleMonitor:
    type: app-extension
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Huddle.HuddleMonitor   # must sit under the app's ID
    sources: [Sources/HuddleMonitor]
    entitlements:
      path: HuddleMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: HuddleMonitor-Info.plist
      properties:
        CFBundleDisplayName: HuddleMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).HuddleMonitor
  HuddleShield:
    type: app-extension
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Huddle.HuddleShield   # must sit under the app's ID
    sources: [Sources/HuddleShield]
    entitlements:
      path: HuddleShield.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: HuddleShield-Info.plist
      properties:
        CFBundleDisplayName: HuddleShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
  HuddleWidgets:
    type: app-extension
    platform: iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Huddle.HuddleWidgets   # must sit under the app's ID
    sources: [Sources/HuddleWidgets, Sources/Shared]
    info:
      path: HuddleWidgets-Info.plist
      properties:
        CFBundleDisplayName: Huddle
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
