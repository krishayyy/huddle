name: Huddle
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # <- set your Apple team ID
targets:
  Huddle:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: Huddle.entitlements
      properties:
        # Needed only for the hard app-blocking shield. Apple must approve this
        # entitlement for your team. Delete this block to build without it.
        com.apple.developer.family-controls: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Huddle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Huddle connects to friends' phones nearby so you can lock in and play together.
        NSBonjourServices:
          - _huddle-app._tcp
          - _huddle-app._udp
