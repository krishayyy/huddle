name: Huddle
options:
  bundleIdPrefix: com.example      # <- change to your own, e.g. com.yourname
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""           # <- set your Apple team ID
targets:
  Huddle:
    type: application
    platform: iOS
    sources: [Sources/HuddleApp.swift, Sources/Models, Sources/Networking, Sources/Views, Sources/Games]
    dependencies:
      - target: HuddleMonitor
      - target: HuddleShield
    entitlements:
      path: Huddle.entitlements
      properties:
        # Full lock needs this. Development builds work on your own devices; shipping to the
        # App Store needs Apple's approval. Delete this block to build without full lock.
        com.apple.developer.family-controls: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Huddle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Huddle connects to friends' phones nearby so you can lock in and play together.
        NSBonjourServices:
          - _huddle-app._tcp
          - _huddle-app._udp
  HuddleMonitor:
    type: app-extension
    platform: iOS
    sources: [Sources/HuddleMonitor]
    entitlements:
      path: HuddleMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: HuddleMonitor-Info.plist
      properties:
        CFBundleDisplayName: HuddleMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).HuddleMonitor
  HuddleShield:
    type: app-extension
    platform: iOS
    sources: [Sources/HuddleShield]
    entitlements:
      path: HuddleShield.entitlements
      properties:
        com.apple.developer.family-controls: true
    info:
      path: HuddleShield-Info.plist
      properties:
        CFBundleDisplayName: HuddleShield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfig
